[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "spindle-data-generation"
version = "0.2.0"
description = "16/20-DOF spindle dynamics, RMS calibration and physical data generation"
requires-python = ">=3.10"
dynamic = ["dependencies"]

[tool.setuptools]
packages = ["spindle", "utils"]
py-modules = ["main", "generation", "calibration"]

[tool.setuptools.package-dir]
"" = "src"
spindle = "src/spindle"
utils = "utils"

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

